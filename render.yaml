services:
  - type: web
    name: khlc-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://khlc.onrender.com,https://kingshouselearning.com,https://www.kingshouselearning.com
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ADMIN_EMAIL
        value: admin@kingshouselearning.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://khlc.onrender.com
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: info@kingshouselearning.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Kingshouse Learning Centre <info@kingshouselearning.com>
