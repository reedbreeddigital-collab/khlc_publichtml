  <!-- LEARNING CENTRE Secondary Wordmark -->
  <text
    x="300"
    y="182"
    text-anchor="middle"
    fill="#9dff13"
    font-family="Dropa"
    font-size="26"
    font-weight="700"
    letter-spacing="8.5"
    textLength="506"
    lengthAdjust="spacingAndGlyphs"
  >
    LEARNING CENTRE
  </text>
