<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" fill="none">
  <!-- Open Book / Sunburst Fan Icon -->
  <g transform="translate(300, 92)">
    <!-- Left 4 Outer Rays (Brand Purple #3b00b3) -->
    <g fill="#3b00b3">
      <!-- Ray -4 (Horizontal outer left page) -->
      <path d="M -22 0 L -96 -2 L -96 -9 L -22 -3 Z" />
      <!-- Ray -3 -->
      <path d="M -21 -2 L -91 -16 L -89 -23 L -20 -5 Z" />
      <!-- Ray -2 -->
      <path d="M -19 -4 L -79 -30 L -75 -36 L -17 -7 Z" />
      <!-- Ray -1 -->
      <path d="M -16 -6 L -60 -43 L -55 -48 L -13 -9 Z" />
    </g>

    <!-- Right 4 Outer Rays (Brand Purple #3b00b3) -->
    <g fill="#3b00b3">
      <!-- Ray +4 (Horizontal outer right page) -->
      <path d="M 22 0 L 96 -2 L 96 -9 L 22 -3 Z" />
      <!-- Ray +3 -->
      <path d="M 21 -2 L 91 -16 L 89 -23 L 20 -5 Z" />
      <!-- Ray +2 -->
      <path d="M 19 -4 L 79 -30 L 75 -36 L 17 -7 Z" />
      <!-- Ray +1 -->
      <path d="M 16 -6 L 60 -43 L 55 -48 L 13 -9 Z" />
    </g>

    <!-- Center 5 Rays + Rising Sun Semicircle Base (Brand Lime #9dff13) -->
    <g fill="#9dff13">
      <!-- Left-Outer Lime Ray -->
      <path d="M -12 -8 L -43 -53 L -36 -57 L -8 -10 Z" />
      <!-- Left-Inner Lime Ray -->
      <path d="M -6 -10 L -23 -59 L -16 -61 L -2 -11 Z" />
      <!-- Center Vertical Lime Ray -->
      <path d="M -3.5 -11 L -3.5 -63 L 3.5 -63 L 3.5 -11 Z" />
      <!-- Right-Inner Lime Ray -->
      <path d="M 2 -11 L 16 -61 L 23 -59 L 6 -10 Z" />
      <!-- Right-Outer Lime Ray -->
      <path d="M 8 -10 L 36 -57 L 43 -53 L 12 -8 Z" />

      <!-- Central Semi-Circle Sun Core -->
      <path d="M -25 0 A 25 22 0 0 1 25 0 Z" />
    </g>
  </g>

  <!-- KINGSHOUSE Primary Wordmark -->
  <text
    x="300"
    y="148"
    text-anchor="middle"
    fill="#3b00b3"
    font-family="Dropa"
    font-size="52"
    font-weight="800"
    letter-spacing="3"
